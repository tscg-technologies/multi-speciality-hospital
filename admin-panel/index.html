<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Aurevia Admin</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/admin.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>

        <main class="main-wrapper">
            <header class="top-header" id="topHeader"></header>

            <div class="main-content" id="dashboard-stats">
                <div class="summary-cards">
                    <div class="card summary-card">
                        <div class="summary-icon"><i data-lucide="calendar-check"></i></div>
                        <div class="summary-details">
                            <h3 id="stat-total-apt">0</h3>
                            <p>Total Appointments</p>
                        </div>
                    </div>
                    <div class="card summary-card">
                        <div class="summary-icon"><i data-lucide="calendar-clock"></i></div>
                        <div class="summary-details">
                            <h3 id="stat-today-apt">0</h3>
                            <p>Today's Appointments</p>
                        </div>
                    </div>
                    <div class="card summary-card">
                        <div class="summary-icon"><i data-lucide="users"></i></div>
                        <div class="summary-details">
                            <h3 id="stat-total-doc">0</h3>
                            <p>Total Patients</p>
                        </div>
                    </div>
                    <div class="card summary-card">
                        <div class="summary-icon" style="background-color:#fff3cd; color:#856404;"><i
                                data-lucide="clock"></i></div>
                        <div class="summary-details">
                            <h3 id="stat-pending-req">0</h3>
                            <p>Pending Requests</p>
                        </div>
                    </div>
                </div>

                <div class="dashboard-grid">
                    <div class="card">
                        <div class="section-header">
                            <h3 style="margin:0;">Recent Appointments</h3>
                            <a href="pages/appointments.html" class="btn btn-outline">View All</a>
                        </div>
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>Patient</th>
                                        <th>Doctor</th>
                                        <th>Date & Time</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody id="recent-appointments-body">
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card">
                        <h3 style="margin-top:0; margin-bottom: 20px;">Appointments Overview</h3>
                        <canvas id="appointmentsChart" width="100" height="100"></canvas>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/layout.js"></script>
    <script src="assets/js/dashboard.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const ctx = document.getElementById('appointmentsChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Completed', 'Pending', 'Confirmed', 'Cancelled'],
                    datasets: [{
                        data: [45, 15, 30, 10],
                        backgroundColor: ['#E9F6F3', '#fff3cd', '#d4edda', '#f8d7da'],
                        borderColor: ['#138C88', '#856404', '#155724', '#721c24'],
                        borderWidth: 1
                    }]
                }
            });
        });
    </script>
</body>

</html>
