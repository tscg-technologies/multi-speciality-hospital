<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointments - Aurevia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        
        <main class="main-wrapper">
            <header class="top-header" id="topHeader"></header>
            
            <div class="main-content">
                <div class="section-header">
                    <h2>Appointments Management</h2>
                    <button class="btn btn-primary" id="addAptBtn"><i data-lucide="plus"></i> New Appointment</button>
                </div>

                <div class="card">
                    <div class="filters-bar">
                        <input type="text" class="form-control" placeholder="Search Patient or ID..." style="max-width: 250px;">
                        <select class="form-control" style="max-width: 200px;">
                            <option value="">All Statuses</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Pending">Pending</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                        <select class="form-control" style="max-width: 200px;">
                            <option value="">All Doctors</option>
                            <option value="Dr. Sarah Smith">Dr. Sarah Smith</option>
                            <option value="Dr. Mike Johnson">Dr. Mike Johnson</option>
                        </select>
                        <button class="btn btn-outline">Filter</button>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Patient Name</th>
                                    <th>Doctor</th>
                                    <th>Specialty</th>
                                    <th>Date & Time</th>
                                    <th>Status</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="appointments-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Appointment Modal -->
    <div class="modal-overlay" id="appointmentModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0;">Appointment Details</h3>
                <i data-lucide="x" class="close-modal" style="cursor:pointer;"></i>
            </div>
            <div class="modal-body">
                <form id="aptForm">
                    <input type="hidden" id="aptId">
                    <div class="form-group">
                        <label class="form-label">Patient Name</label>
                        <input type="text" class="form-control" id="patientName" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Doctor</label>
                        <select class="form-control" id="doctorName" required>
                            <option value="Dr. Sarah Smith">Dr. Sarah Smith</option>
                            <option value="Dr. Mike Johnson">Dr. Mike Johnson</option>
                            <option value="Dr. Emily Davis">Dr. Emily Davis</option>
                        </select>
                    </div>
                    <div class="form-group" style="display: flex; gap: 16px;">
                        <div style="flex:1;">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="aptDate" required>
                        </div>
                        <div style="flex:1;">
                            <label class="form-label">Time</label>
                            <input type="time" class="form-control" id="aptTime" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-control" id="aptStatus" required>
                            <option value="Pending">Pending</option>
                            <option value="Confirmed">Confirmed</option>
                            <option value="Completed">Completed</option>
                            <option value="Cancelled">Cancelled</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline btn-cancel" type="button">Cancel</button>
                <button class="btn btn-primary" form="aptForm" type="submit">Save Appointment</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/appointments.js"></script>
</body>
</html>
