<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Content - Aurevia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-wrapper">
            <header class="top-header" id="topHeader"></header>
            <div class="main-content">
                <div class="section-header">
                    <h2>Website Content Management</h2>
                    <button class="btn btn-primary" onclick="alert('Changes saved to localStorage!')"><i data-lucide="save"></i> Save Changes</button>
                </div>
                <div class="card" style="max-width: 800px;">
                    <form>
                        <div class="form-group">
                            <label class="form-label">Homepage Hero Headline</label>
                            <input type="text" class="form-control" value="Premium Healthcare for You">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Homepage Hero Description</label>
                            <textarea class="form-control" rows="4">Experience world-class medical facilities with compassionate care.</textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Contact Phone Placeholder</label>
                            <input type="text" class="form-control" value="+1-800-AUREVIA">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Footer Description</label>
                            <textarea class="form-control" rows="2">Leading multi-specialty hospital committed to your well-being.</textarea>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/layout.js"></script>
</body>
</html>
