<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Aurevia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main-wrapper">
            <header class="top-header" id="topHeader"></header>
            <div class="main-content">
                <div class="section-header">
                    <h2>Global Settings</h2>
                    <button class="btn btn-primary" onclick="alert('Settings saved to localStorage!')"><i data-lucide="save"></i> Save Settings</button>
                </div>
                <div class="dashboard-grid">
                    <div class="card">
                        <h3 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:12px;">Hospital Profile</h3>
                        <form style="margin-top:16px;">
                            <div class="form-group">
                                <label class="form-label">Hospital Name</label>
                                <input type="text" class="form-control" value="Aurevia Multispecialty Hospital">
                            </div>
                            <div class="form-group">
                                <label class="form-label">System Timezone</label>
                                <select class="form-control">
                                    <option>UTC-5 (EST)</option>
                                    <option>UTC+0 (GMT)</option>
                                </select>
                            </div>
                        </form>
                    </div>
                    <div class="card">
                        <h3 style="margin-top:0; border-bottom:1px solid var(--border-color); padding-bottom:12px;">Data Management</h3>
                        <p style="color:var(--text-secondary); margin-top:16px;">This will reset all demo records (Appointments, Doctors, etc.) back to original states.</p>
                        <button class="btn btn-danger" style="margin-top:16px;" onclick="window.resetDemoData()"><i data-lucide="rotate-ccw"></i> Reset Demo Data</button>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/layout.js"></script>
</body>
</html>
