<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff - Aurevia Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/admin.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <aside class="sidebar" id="sidebar"></aside>
        
        <main class="main-wrapper">
            <header class="top-header" id="topHeader"></header>
            
            <div class="main-content">
                <div class="section-header">
                    <h2>Staff Management</h2>
                    <button class="btn btn-primary" id="addBtn"><i data-lucide="plus"></i> Add Staff Member</button>
                </div>

                <div class="card">
                    <div class="filters-bar">
                        <input type="text" id="searchInput" class="form-control" placeholder="Search Staff..." style="max-width: 250px;">
                        <select id="statusFilter" class="form-control" style="max-width: 200px;">
                            <option value="">All Statuses</option>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>

                    <div class="table-container">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Department</th>
                                    <th>Role</th>
                                    <th>Branch</th>
                                    <th>Status</th>
                                    
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="dataTableBody">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="itemModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0;">Staff Member Details</h3>
                <i data-lucide="x" class="close-modal" style="cursor:pointer"></i>
            </div>
            <div class="modal-body">
                <form id="itemForm">
                    <input type="hidden" id="itemId">
                    
                    <div class="form-group">
                        <label class="form-label">Name</label>
                        <input type="text" class="form-control" id="field_name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" id="field_department" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Role</label>
                        <input type="text" class="form-control" id="field_role" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Branch</label>
                        <input type="text" class="form-control" id="field_branch" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Status</label>
                        <select class="form-control" id="field_status" required>
                            <option value="Active">Active</option>
                            <option value="Inactive">Inactive</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-outline btn-cancel" type="button">Cancel</button>
                <button class="btn btn-primary" form="itemForm" type="submit">Save Staff Member</button>
            </div>
        </div>
    </div>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/staff.js"></script>
</body>
</html>
