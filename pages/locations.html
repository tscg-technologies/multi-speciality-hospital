<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Locations | Aurevia Multispecialty Hospital</title>
    
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="../assets/css/components.css">
    <link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body class="bg-ivory">
    <header id="main-header">
        <div class="container header-container">
            <a href="../index.html" class="logo">
                <svg class="logo-icon" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
                Aurevia
            </a>
            <nav class="nav-links">
                <a href="../index.html">Home</a>
                <a href="about.html">About Us</a>
                <a href="specialties.html">Specialties</a>
                <a href="doctors.html">Doctors</a>
                <a href="facilities.html">Facilities</a>
                <a href="patient-resources.html">Patients</a>
                <a href="contact.html">Contact</a>
                <a href="appointments.html" class="btn btn-primary">Book Appointment</a>
            </nav>
            <button class="mobile-menu-btn">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 6h16M4 12h16M4 18h16"/></svg>
            </button>
        </div>
    </header>

    <div class="bg-navy" style="padding: var(--space-12) 0;">
        <div class="container text-center">
            <h1 style="color: var(--clr-white);">Our Hospital Network</h1>
            <p style="max-width: 600px; margin: 0 auto; color: rgba(255,255,255,0.8); font-size: 1.125rem;">Find an Aurevia care facility near you. (Demo Locations)</p>
        </div>
    </div>

    <section class="section-padding">
        <div class="container">
            <div id="locations-container" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: var(--space-8);">
                <!-- Populated by JS -->
            </div>
        </div>
    </section>

    <footer style="margin-top: auto;">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 Aurevia Hospital Demo. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="../assets/js/data.js"></script>
    <script src="../assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('locations-container');
            if (container && window.hospitalData) {
                window.hospitalData.locations.forEach(loc => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.style.border = "none";
                    card.style.boxShadow = "var(--shadow-lg)";
                    card.innerHTML = `
                        <div style="height: 250px; background-color: var(--clr-border); position: relative;">
                            <!-- Placeholder Map Image -->
                            <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1474&auto=format&fit=crop" style="width: 100%; height: 100%; object-fit: cover;" alt="Location Map">
                            <div style="position: absolute; bottom: 0; left: 0; width: 100%; height: 60%; background: linear-gradient(to top, rgba(18, 48, 71, 0.9), transparent);"></div>
                            <h3 style="position: absolute; bottom: var(--space-4); left: var(--space-6); color: var(--clr-white); margin: 0; font-size: 1.5rem;">${loc.name}</h3>
                        </div>
                        <div class="card-content" style="padding: var(--space-6);">
                            <div style="display: flex; gap: var(--space-3); align-items: flex-start; margin-bottom: var(--space-4);">
                                <svg style="color: var(--clr-teal); flex-shrink: 0; margin-top: 2px;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                                <span style="font-size: 1.125rem; font-weight: 500; color: var(--clr-navy);">${loc.address}</span>
                            </div>
                            <div style="display: flex; gap: var(--space-3); align-items: center; margin-bottom: var(--space-8);">
                                <svg style="color: var(--clr-teal); flex-shrink: 0;" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                                <span style="font-size: 1.125rem; color: var(--clr-text-secondary);">${loc.phone}</span>
                            </div>
                            <div style="display: flex; gap: var(--space-3); margin-top: auto;">
                                <a href="location-details.html?id=${loc.id}" class="btn btn-outline" style="flex: 1; padding: 0.75rem; font-size: 0.9375rem;">View Details</a>
                                <a href="#" class="btn btn-primary" style="flex: 1; padding: 0.75rem; font-size: 0.9375rem;" onclick="alert('Directions link placeholder'); return false;">Directions</a>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            }
        });
    </script>
</body>
</html>
